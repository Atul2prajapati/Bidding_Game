<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Installable app: Android "Install app" / iPhone "Add to Home Screen" -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="$100 Draft">
  <meta name="description" content="Pick Anime, Pokémon, Superheroes, Football, Cricket or Food. Five random cards each turn, $100 to build the best team.">
  <meta name="theme-color" content="#0e9f5f">
  <title>Hundred Dollar Draft</title>
  <link rel="icon" type="image/png" href="/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/config.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <main class="wrap" id="app">
    <noscript>Hundred Dollar Draft needs JavaScript turned on.</noscript>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="turn-glow" id="turnGlow" aria-hidden="true"></div>
</body>
</html>
